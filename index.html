  <!-- Firebase SDK Modular -->
  <script type="module">

    // KUNCI FIREBASE:
    const firebaseConfig = {
      apiKey: "AIzaSyDfYW0-lvnz7jgMD6atXV6WiAF0m_p5i_8",
      authDomain: "ward-tracker-9d44f.firebaseapp.com",
      projectId: "ward-tracker-9d44f",
      storageBucket: "ward-tracker-9d44f.firebasestorage.app",
      messagingSenderId: "275444842239",
      appId: "1:275444842239:web:d627862e33c7fbffc1d6ca",
      measurementId: "G-GSG94X1PLD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "ward_patients");

    // Daftar DPJP Obgyn Ruang Mawar
    const DEFAULT_OBGYN_DPJP = [
      "dr. M Dwinanda Junaedi, Sp.OG",
      "dr. Fatimah Z, Sp.OG",
      "dr. Ericka Anggraini, Sp.OG M.Ked.Klin",

    ];

    let currentUser = null;
    let patients = [];
    let currentStatus = 'Aktif Rawat';
    let currentQuery = '';
    let currentDpjp = 'Semua';
    let viewMode = 'grid'; // 'grid' (Kartu) atau 'list' (List Simple)

    // Helper tanggal hari ini dalam format YYYY-MM-DD (waktu lokal)
    function getTodayDateString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Helper untuk format tanggal dari timestamp atau string YYYY-MM-DD (contoh: 24 Okt 2026)
    function formatTanggal(val) {
      if (!val) return '';
      if (typeof val === 'string' && val.includes('-')) {
        const [y, m, d] = val.split('-').map(Number);
        return new Date(y, m - 1, d).toLocaleDateString('id-ID', {
          day: '2-digit',
          month: 'short',
          year: 'numeric'
        });
      }
      return new Date(val).toLocaleDateString('id-ID', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      });
    }

    // Helper untuk format tanggal dan waktu ringkas (contoh: 24 Okt 14:15)
    function formatTanggalWaktu(val) {
      if (!val) return '';
      const d = new Date(val);
      if (isNaN(d.getTime())) return '';
      const tgl = d.toLocaleDateString('id-ID', {
        day: '2-digit',
        month: 'short'
      });
      const jam = d.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      return `${tgl} ${jam}`;
    }

    // Helper untuk menghitung Hari Rawat (Hari ke-1, Hari ke-2, dst.)
    function hitungHariRawat(tglMrs, status, krsAt) {
      if (!tglMrs) return null;
      const [y, m, d] = tglMrs.split('-').map(Number);
      const start = new Date(y, m - 1, d);
      start.setHours(0, 0, 0, 0);

      const end = (status === 'KRS' && krsAt) ? new Date(krsAt) : new Date();
      end.setHours(0, 0, 0, 0);

      const diffTime = end - start;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return diffDays > 0 ? diffDays : 1;
    }

    // Helper untuk format tulisan kecil audit pembuat / pengedit (Tampilan Kartu)
    function formatAuditFooter(p) {
      if (p.createdBy && p.updatedBy && p.createdBy !== p.updatedBy) {
        return `
          <div class="flex items-center gap-1 truncate text-slate-400" title="Dibuat oleh ${p.createdBy} (${formatTanggalWaktu(p.createdAt)})">
            <span class="shrink-0 text-[10px]">✍️</span>
            <span class="text-slate-500">Dibuat:</span>
            <span class="font-medium text-slate-700 truncate">${p.createdBy}</span>
            ${p.createdAt ? `<span class="shrink-0 text-[10px] text-slate-400">(${formatTanggalWaktu(p.createdAt)})</span>` : ''}
          </div>
          <div class="flex items-center gap-1 truncate text-slate-400" title="Terakhir diedit oleh ${p.updatedBy} (${formatTanggalWaktu(p.updatedAt)})">
            <span class="shrink-0 text-[10px]">✏️</span>
            <span class="text-slate-500">Diedit:</span>
            <span class="font-medium text-slate-700 truncate">${p.updatedBy}</span>
            ${p.updatedAt ? `<span class="shrink-0 text-[10px] text-slate-400">(${formatTanggalWaktu(p.updatedAt)})</span>` : ''}
          </div>
        `;
      }
      if (p.createdBy) {
        return `
          <div class="flex items-center gap-1 truncate text-slate-400" title="Dibuat oleh ${p.createdBy} (${formatTanggalWaktu(p.createdAt || p.updatedAt)})">
            <span class="shrink-0 text-[10px]">✍️</span>
            <span class="text-slate-500">Oleh:</span>
            <span class="font-medium text-slate-700 truncate">${p.createdBy}</span>
            ${(p.createdAt || p.updatedAt) ? `<span class="shrink-0 text-[10px] text-slate-400">(${formatTanggalWaktu(p.createdAt || p.updatedAt)})</span>` : ''}
          </div>
        `;
      }
      if (p.updatedBy) {
        return `
          <div class="flex items-center gap-1 truncate text-slate-400" title="Diedit oleh ${p.updatedBy} (${formatTanggalWaktu(p.updatedAt)})">
            <span class="shrink-0 text-[10px]">✏️</span>
            <span class="text-slate-500">Diedit:</span>
            <span class="font-medium text-slate-700 truncate">${p.updatedBy}</span>
            ${p.updatedAt ? `<span class="shrink-0 text-[10px] text-slate-400">(${formatTanggalWaktu(p.updatedAt)})</span>` : ''}
          </div>
        `;
      }
      return `<div class="text-[10px] text-slate-400 italic">Data awal sistem</div>`;
    }

    // Helper untuk format tulisan kecil audit di Mode List Simple
    function formatAuditInline(p) {
      const parts = [];
      if (p.createdBy) {
        parts.push(`<span>✍️ <span class="text-slate-500">Oleh:</span> <b class="font-medium text-slate-700">${p.createdBy}</b></span>`);
      }
      if (p.updatedBy && p.updatedBy !== p.createdBy) {
        parts.push(`<span>✏️ <span class="text-slate-500">Diedit:</span> <b class="font-medium text-slate-700">${p.updatedBy}</b> <span class="text-[10px] text-slate-400">(${formatTanggalWaktu(p.updatedAt)})</span></span>`);
      } else if (!p.createdBy && p.updatedBy) {
        parts.push(`<span>✏️ <span class="text-slate-500">Diedit:</span> <b class="font-medium text-slate-700">${p.updatedBy}</b> <span class="text-[10px] text-slate-400">(${formatTanggalWaktu(p.updatedAt)})</span></span>`);
      } else if (p.createdAt || p.updatedAt) {
        parts.push(`<span class="text-[10px] text-slate-400">(${formatTanggalWaktu(p.createdAt || p.updatedAt)})</span>`);
      }
      return parts.length ? parts.join('<span class="text-slate-300 mx-1">•</span>') : '<span class="italic text-slate-400">Data awal</span>';
    }

    // ==========================================
    // SISTEM LOGIN & MANAJEMEN PENGGUNA
    // ==========================================
    function initAuth() {
      try {
        const saved = localStorage.getItem('mawar_current_user');
        if (saved) {
          currentUser = JSON.parse(saved);
          updateUserUI();
        } else {
          openLoginModal(true);
        }
      } catch (err) {
        console.error("Gagal membaca user:", err);
        openLoginModal(true);
      }
    }

    window.openLoginModal = function(isForced = false) {
      const modal = document.getElementById('login-modal');
      modal.classList.remove('hidden');
      renderRecentUsers();

      const closeBtn = document.getElementById('login-modal-close');
      if (closeBtn) {
        if (currentUser && !isForced) {
          closeBtn.classList.remove('hidden');
        } else {
          closeBtn.classList.add('hidden');
        }
      }

      const nameInput = document.getElementById('input-login-name');
      if (currentUser && !isForced) {
        nameInput.value = currentUser.name;
      } else {
        nameInput.value = '';
        document.getElementById('input-login-pin').value = '';
      }
      setTimeout(() => nameInput.focus(), 150);
    };

    window.closeLoginModal = function() {
      if (!currentUser) {
        alert("Silakan login dengan mengisi nama Anda terlebih dahulu.");
        return;
      }
      document.getElementById('login-modal').classList.add('hidden');
    };

    window.handleLogin = function(e) {
      e.preventDefault();
      const name = document.getElementById('input-login-name').value.trim();
      const pin = document.getElementById('input-login-pin').value.trim();

      // Validasi PIN Ruangan (default '1234' atau 'mawar', fleksibel agar tim tidak terkunci)
      if (pin && pin !== '1234' && pin.toLowerCase() !== 'mawar') {
        alert('PIN Ruangan salah.');
        return;
      }

      if (!name) {
        alert('Silakan ketik nama dokter / petugas jaga.');
        return;
      }

      currentUser = {
        name: name,
        loginAt: Date.now()
      };

      try {
        localStorage.setItem('mawar_current_user', JSON.stringify(currentUser));
        saveRecentUser(currentUser);
      } catch (err) {
        console.error("Gagal menyimpan ke localStorage:", err);
      }

      updateUserUI();
      document.getElementById('login-modal').classList.add('hidden');
    };

    window.logoutUser = function() {
      const nama = currentUser ? currentUser.name : 'ini';
      if (confirm(`Ganti akun atau keluar dari "${nama}"?`)) {
        currentUser = null;
        localStorage.removeItem('mawar_current_user');
        updateUserUI();
        window.openLoginModal(true);
      }
    };

    function saveRecentUser(user) {
      try {
        let recents = JSON.parse(localStorage.getItem('mawar_recent_users') || '[]');
        recents = recents.filter(u => u.name.toLowerCase() !== user.name.toLowerCase());
        recents.unshift({ name: user.name });
        if (recents.length > 5) recents = recents.slice(0, 5);
        localStorage.setItem('mawar_recent_users', JSON.stringify(recents));
      } catch (err) {}
    }

    function renderRecentUsers() {
      try {
        const recents = JSON.parse(localStorage.getItem('mawar_recent_users') || '[]');
        const section = document.getElementById('recent-users-section');
        const container = document.getElementById('recent-users-list');
        if (!recents || recents.length === 0) {
          section.classList.add('hidden');
          return;
        }
        section.classList.remove('hidden');
        container.innerHTML = recents.map(u => {
          const safeName = u.name.replace(/'/g, "\\'");
          return `
            <button type="button" onclick="selectQuickUser('${safeName}')" class="px-2.5 py-1 rounded-lg text-xs bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200 transition font-medium text-slate-700 flex items-center gap-1.5 cursor-pointer">
              <span>👤</span> ${u.name}
            </button>
          `;
        }).join('');
      } catch (err) {}
    }

    window.selectQuickUser = function(name) {
      document.getElementById('input-login-name').value = name;
      document.getElementById('input-login-pin').focus();
    };

    function updateUserUI() {
      const avatar = document.getElementById('user-avatar');
      const nameEl = document.getElementById('user-display-name');
      const roleEl = document.getElementById('user-display-role');
      const logoutBtn = document.getElementById('btn-logout');
      const mobileAvatar = document.getElementById('user-avatar-mobile');
      const mobileName = document.getElementById('user-display-name-mobile');

      if (currentUser) {
        const initials = currentUser.name.split(' ').map(n => n[0]).filter(Boolean).slice(0, 2).join('').toUpperCase() || 'U';
        if (avatar) {
          avatar.textContent = initials;
          avatar.className = 'w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-xs';
        }
        if (nameEl) nameEl.textContent = currentUser.name;
        if (roleEl) roleEl.textContent = 'Sedang Jaga';
        if (logoutBtn) logoutBtn.classList.remove('hidden');

        if (mobileAvatar) {
          mobileAvatar.textContent = initials;
          mobileAvatar.className = 'w-5 h-5 rounded-md bg-emerald-600 text-white flex items-center justify-center text-[10px] font-bold shrink-0';
        }
        if (mobileName) {
          mobileName.textContent = currentUser.name.split(' ')[0] || currentUser.name;
        }
      } else {
        if (avatar) {
          avatar.textContent = '?';
          avatar.className = 'w-7 h-7 rounded-lg bg-slate-300 text-slate-600 flex items-center justify-center font-bold text-xs shrink-0';
        }
        if (nameEl) nameEl.textContent = 'Belum Login';
        if (roleEl) roleEl.textContent = 'Klik untuk Masuk';
        if (logoutBtn) logoutBtn.classList.add('hidden');

        if (mobileAvatar) {
          mobileAvatar.textContent = '?';
          mobileAvatar.className = 'w-5 h-5 rounded-md bg-slate-300 text-slate-600 flex items-center justify-center text-[10px] font-bold shrink-0';
        }
        if (mobileName) mobileName.textContent = 'Login';
      }
    }

    // Listener Real-Time: Perubahan di HP langsung update di PC secara instan
    onSnapshot(colRef, (snapshot) => {
      patients = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      
      const badge = document.getElementById('sync-indicator');
      if (badge) {
        badge.textContent = 'Live Synced';
        badge.className = 'px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200';
      }
      render();
    }, (err) => {
      console.error("Firestore Error:", err);
      const badge = document.getElementById('sync-indicator');
      if (badge) {
        badge.textContent = 'Gagal Sync';
        badge.className = 'px-2 py-0.5 rounded-full text-xs font-semibold bg-red-50 text-red-700 border border-red-200';
      }
    });

    // Menampilkan atau menyembunyikan input DPJP manual
    window.handleDpjpSelectChange = function(val) {
      const manualInput = document.getElementById('input-dpjp-manual');
      if (val === 'MANUAL') {
        manualInput.classList.remove('hidden');
        manualInput.focus();
      } else {
        manualInput.classList.add('hidden');
        manualInput.value = '';
      }
    };

    window.savePatient = async function(e) {
      e.preventDefault();
      if (!currentUser) {
        alert("Silakan login terlebih dahulu untuk menyimpan data.");
        window.openLoginModal(true);
        return;
      }

      const id = document.getElementById('edit-id').value;
      const selectedDpjp = document.getElementById('select-dpjp').value;
      const manualDpjp = document.getElementById('input-dpjp-manual').value.trim();
      const finalDpjp = selectedDpjp === 'MANUAL' ? (manualDpjp || 'DPJP Umum') : (selectedDpjp || 'DPJP Umum');
      const statusVal = document.getElementById('input-status').value;
      const tglMrsVal = document.getElementById('input-mrs').value || getTodayDateString();

      const existingPatient = id ? patients.find(item => item.id === id) : null;

      const data = {
        nama: document.getElementById('input-nama').value.trim(),
        noRm: document.getElementById('input-norm').value.trim(),
        kamar: document.getElementById('input-kamar').value.trim(),
        dpjp: finalDpjp,
        tglMrs: tglMrsVal,
        diagnosis: document.getElementById('input-dx').value.trim() || '-',
        status: statusVal
      };

      // Set tanggal KRS jika status diubah jadi KRS lewat form
      if (statusVal === 'KRS') {
        data.krsAt = (existingPatient && existingPatient.krsAt) ? existingPatient.krsAt : Date.now();
      } else {
        data.krsAt = null;
      }

      try {
        if (id && existingPatient) {
          // Cek apakah ada perubahan data dibanding data sebelumnya
          const isNamaChanged = data.nama !== (existingPatient.nama || '').trim();
          const isNoRmChanged = data.noRm !== (existingPatient.noRm || '').trim();
          const isKamarChanged = data.kamar !== (existingPatient.kamar || '').trim();
          const isDpjpChanged = data.dpjp !== (existingPatient.dpjp || '').trim();
          const isTglMrsChanged = (data.tglMrs || '') !== (existingPatient.tglMrs || '');
          const isDiagnosisChanged = (data.diagnosis || '-').trim() !== (existingPatient.diagnosis || '-').trim();
          const isStatusChanged = data.status !== (existingPatient.status || 'Aktif Rawat');

          const hasChanges = isNamaChanged || isNoRmChanged || isKamarChanged || isDpjpChanged || isTglMrsChanged || isDiagnosisChanged || isStatusChanged;

          if (!hasChanges) {
            // Jika tidak ada tulisan yang dirubah, jangan rubah pembuat atau pengeditnya
            closeModal();
            return;
          }

          // Jika ada perubahan, perbarui pengedit dan waktu update
          data.updatedBy = currentUser.name;
          data.updatedAt = Date.now();

          // Pertahankan pencatat awal jika sudah ada
          if (existingPatient.createdBy) {
            data.createdBy = existingPatient.createdBy;
          }
          if (existingPatient.createdAt) {
            data.createdAt = existingPatient.createdAt;
          }
          await updateDoc(doc(db, "ward_patients", id), data);
        } else {
          // Data pasien baru
          await addDoc(colRef, { 
            ...data, 
            createdBy: currentUser.name,
            createdAt: Date.now(),
            updatedBy: currentUser.name,
            updatedAt: Date.now()
          });
        }
        closeModal();
      } catch (error) {
        alert("Gagal menyimpan data: " + error.message);
      }
    };

    // Konfirmasi KRS & Simpan Tanggal KRS serta Pengedit
    window.toggleStatus = async function(id, current) {
      if (!currentUser) {
        alert("Silakan login terlebih dahulu untuk mengubah status.");
        window.openLoginModal(true);
        return false;
      }

      const p = patients.find(item => item.id === id);
      const namaPasien = p ? p.nama : 'ini';

      if (current === 'Aktif Rawat') {
        if (!confirm(`Apakah Anda yakin pasien "${namaPasien}" sudah KRS (Pulang)?`)) {
          return false;
        }
        await updateDoc(doc(db, "ward_patients", id), { 
          status: 'KRS', 
          krsAt: Date.now(),
          updatedAt: Date.now(),
          updatedBy: currentUser.name
        });
      } else {
        if (!confirm(`Aktifkan kembali status rawat inap untuk pasien "${namaPasien}"?`)) {
          return false;
        }
        await updateDoc(doc(db, "ward_patients", id), { 
          status: 'Aktif Rawat', 
          krsAt: null,
          updatedAt: Date.now(),
          updatedBy: currentUser.name
        });
      }
      return true;
    };

    // Pindahkan ke daftar Terhapus (Soft Delete)
    window.deletePatient = async function(id) {
      if (!currentUser) {
        alert("Silakan login terlebih dahulu untuk menghapus data.");
        window.openLoginModal(true);
        return;
      }

      if (confirm('Pindahkan data pasien ini ke daftar Terhapus?')) {
        await updateDoc(doc(db, "ward_patients", id), {
          status: 'Terhapus',
          deletedAt: Date.now(),
          updatedAt: Date.now(),
          updatedBy: currentUser.name,
          deletedBy: currentUser.name
        });
      }
    };

    // Pulihkan pasien dari daftar Terhapus ke Aktif Rawat
    window.restorePatient = async function(id) {
      if (!currentUser) {
        alert("Silakan login terlebih dahulu untuk memulihkan data.");
        window.openLoginModal(true);
        return;
      }

      await updateDoc(doc(db, "ward_patients", id), {
        status: 'Aktif Rawat',
        updatedAt: Date.now(),
        updatedBy: currentUser.name
      });
    };

    // Hapus permanen dari database Firebase
    window.permanentDeletePatient = async function(id) {
      if (!currentUser) {
        alert("Silakan login terlebih dahulu.");
        window.openLoginModal(true);
        return;
      }

      if (confirm('Hapus PERMANEN data pasien ini dari database? Tindakan ini tidak bisa dibatalkan.')) {
        await deleteDoc(doc(db, "ward_patients", id));
      }
    };

    window.setStatusFilter = function(status) {
      currentStatus = status;
      document.getElementById('tab-aktif').className = status === 'Aktif Rawat' 
        ? 'px-3 py-1.5 rounded-lg bg-white text-emerald-700 font-bold shadow-xs' 
        : 'px-3 py-1.5 rounded-lg text-slate-600';
      document.getElementById('tab-krs').className = status === 'KRS' 
        ? 'px-3 py-1.5 rounded-lg bg-white text-slate-900 font-bold shadow-xs' 
        : 'px-3 py-1.5 rounded-lg text-slate-600';
      document.getElementById('tab-deleted').className = status === 'Terhapus' 
        ? 'px-3 py-1.5 rounded-lg bg-white text-red-600 font-bold shadow-xs' 
        : 'px-3 py-1.5 rounded-lg text-slate-600';
      render();
    };

    window.setViewMode = function(mode) {
      viewMode = mode;
      document.getElementById('btn-view-grid').className = mode === 'grid'
        ? 'px-3 py-1.5 rounded-lg bg-white text-emerald-700 font-bold shadow-xs flex items-center gap-1'
        : 'px-3 py-1.5 rounded-lg text-slate-600 flex items-center gap-1';
      document.getElementById('btn-view-list').className = mode === 'list'
        ? 'px-3 py-1.5 rounded-lg bg-white text-emerald-700 font-bold shadow-xs flex items-center gap-1'
        : 'px-3 py-1.5 rounded-lg text-slate-600 flex items-center gap-1';
      render();
    };

    window.handleSearch = function(val) {
      currentQuery = val.toLowerCase().trim();
      render();
    };

    window.handleDpjpFilter = function(val) {
      currentDpjp = val;
      render();
    };

    // Modal Pop-up Detail Pasien (Saat baris di Mode List diklik)
    window.openDetailModal = function(id) {
      const p = patients.find(item => item.id === id);
      if (!p) return;

      const hariRawat = hitungHariRawat(p.tglMrs, p.status, p.krsAt);

      document.getElementById('detail-kamar').textContent = p.kamar;
      document.getElementById('detail-nama').textContent = p.nama;
      document.getElementById('detail-norm').textContent = 'RM: ' + p.noRm;
      document.getElementById('detail-dpjp').textContent = p.dpjp;
      document.getElementById('detail-dx').textContent = p.diagnosis || '-';

      // Audit info di modal detail
      const createdEl = document.getElementById('detail-created');
      const updatedEl = document.getElementById('detail-updated');
      if (createdEl) {
        createdEl.textContent = p.createdBy 
          ? `${p.createdBy} ${p.createdAt ? '• ' + formatTanggalWaktu(p.createdAt) : ''}`
          : 'Data awal sistem';
      }
      if (updatedEl) {
        updatedEl.textContent = p.updatedBy 
          ? `${p.updatedBy} ${p.updatedAt ? '• ' + formatTanggalWaktu(p.updatedAt) : ''}`
          : (p.updatedAt ? formatTanggalWaktu(p.updatedAt) : '-');
      }

      const mrsBadge = document.getElementById('detail-mrs');
      if (p.tglMrs) {
        mrsBadge.textContent = `MRS: ${formatTanggal(p.tglMrs)} (${ p.status === 'KRS' ? `Rawat ${hariRawat} hari` : `Hari ke-${hariRawat}` })`;
        mrsBadge.classList.remove('hidden');
      } else {
        mrsBadge.classList.add('hidden');
      }
      
      const statusBadge = document.getElementById('detail-status');
      const tglKrs = p.status === 'KRS' && p.krsAt ? ` (${formatTanggal(p.krsAt)})` : '';
      statusBadge.textContent = p.status + tglKrs;
      statusBadge.className = 'px-2.5 py-0.5 rounded-full text-xs font-semibold ' + 
        (p.status === 'Aktif Rawat' ? 'bg-emerald-50 text-emerald-700' : p.status === 'KRS' ? 'bg-slate-100 text-slate-600' : 'bg-red-50 text-red-700');

      const actionsDiv = document.getElementById('detail-actions');
      if (p.status === 'Terhapus') {
        actionsDiv.innerHTML = `
          <button onclick="restorePatient('${p.id}'); closeDetailModal();" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-700 cursor-pointer">Pulihkan Pasien</button>
          <button onclick="permanentDeletePatient('${p.id}'); closeDetailModal();" class="py-2 px-3 rounded-xl text-xs font-bold bg-red-50 text-red-600 border border-red-200 hover:bg-red-600 hover:text-white cursor-pointer">Hapus Permanen</button>
        `;
      } else {
        actionsDiv.innerHTML = `
          <button onclick="toggleStatus('${p.id}', '${p.status}').then(ok => { if(ok) closeDetailModal(); })" class="flex-1 py-2 px-3 rounded-xl text-xs font-semibold border cursor-pointer ${p.status === 'Aktif Rawat' ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-600 hover:text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
            ${p.status === 'Aktif Rawat' ? 'Tandai KRS' : 'Aktifkan Kembali'}
          </button>
          <button onclick="closeDetailModal(); openModal('${p.id}');" class="py-2 px-4 rounded-xl text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-600 hover:text-white cursor-pointer">Edit Data</button>
        `;
      }

      document.getElementById('detail-modal').classList.remove('hidden');
    };

    window.closeDetailModal = function() {
      document.getElementById('detail-modal').classList.add('hidden');
    };

    window.openModal = function(id = null) {
      if (!currentUser) {
        alert("Silakan login terlebih dahulu untuk menambah atau mengedit data.");
        window.openLoginModal(true);
        return;
      }

      document.getElementById('modal').classList.remove('hidden');
      const selectDpjp = document.getElementById('select-dpjp');
      const manualDpjp = document.getElementById('input-dpjp-manual');

      if (id) {
        const p = patients.find(item => item.id === id);
        document.getElementById('modal-title').textContent = 'Edit Data Pasien';
        document.getElementById('edit-id').value = p.id;
        document.getElementById('input-nama').value = p.nama;
        document.getElementById('input-norm').value = p.noRm;
        document.getElementById('input-kamar').value = p.kamar;
        document.getElementById('input-mrs').value = p.tglMrs || getTodayDateString();
        
        // Cek apakah DPJP pasien ada di daftar Obgyn atau ketik manual (Non-Obgyn)
        if (DEFAULT_OBGYN_DPJP.includes(p.dpjp)) {
          selectDpjp.value = p.dpjp;
          manualDpjp.classList.add('hidden');
          manualDpjp.value = '';
        } else {
          selectDpjp.value = 'MANUAL';
          manualDpjp.classList.remove('hidden');
          manualDpjp.value = (p.dpjp && p.dpjp !== 'DPJP Umum') ? p.dpjp : '';
        }

        document.getElementById('input-dx').value = p.diagnosis;
        document.getElementById('input-status').value = p.status;
      } else {
        document.getElementById('modal-title').textContent = 'Input Pasien Baru';
        document.getElementById('patient-form').reset();
        document.getElementById('edit-id').value = '';
        document.getElementById('input-mrs').value = getTodayDateString();
        selectDpjp.value = DEFAULT_OBGYN_DPJP[0]; // Default ke pilihan pertama agar cepat
        manualDpjp.classList.add('hidden');
        manualDpjp.value = '';
      }
    };

    window.closeModal = function() {
      document.getElementById('modal').classList.add('hidden');
    };

    window.copyHandoff = function() {
      const active = patients.filter(p => p.status === 'Aktif Rawat');
      if (active.length === 0) return alert('Tidak ada pasien aktif untuk operan.');
      
      const pelapor = currentUser ? `\nPetugas Jaga: ${currentUser.name}\n` : '';
      let text = `*OPERAN JAGA BANGSAL RAWAT INAP*${pelapor}Total Pasien Aktif: ${active.length}\n------------------------------\n`;
      active.forEach((p, idx) => {
        const hari = hitungHariRawat(p.tglMrs, p.status, p.krsAt);
        const infoMrs = p.tglMrs ? ` (MRS: ${formatTanggal(p.tglMrs)} • Hari ke-${hari})` : '';
        text += `\n${idx + 1}. *[${p.kamar}]* *${p.nama}* (RM: ${p.noRm})${infoMrs}\n   • DPJP: ${p.dpjp}\n   • Dx: ${p.diagnosis}\n`;
      });
      navigator.clipboard.writeText(text).then(() => alert('Teks operan berhasil disalin ke clipboard!'));
    };

    function render() {
      const aktifCount = patients.filter(p => p.status === 'Aktif Rawat').length;
      const krsCount = patients.filter(p => p.status === 'KRS').length;
      const deletedCount = patients.filter(p => p.status === 'Terhapus').length;
      
      document.getElementById('count-aktif').textContent = aktifCount;
      document.getElementById('count-krs').textContent = krsCount;
      document.getElementById('count-deleted').textContent = deletedCount;

      // Update dropdown filter DPJP secara otomatis
      const dpjpSelect = document.getElementById('filter-dpjp');
      const currentSelected = dpjpSelect.value;
      const dpjpList = Array.from(new Set(patients.map(p => p.dpjp).filter(Boolean)));
      dpjpSelect.innerHTML = '<option value="Semua">Semua DPJP</option>' + 
        dpjpList.map(d => `<option value="${d}" ${d === currentSelected ? 'selected' : ''}>${d}</option>`).join('');

      const filtered = patients.filter(p => {
        if (p.status !== currentStatus) return false;
        if (currentDpjp !== 'Semua' && p.dpjp !== currentDpjp) return false;
        if (currentQuery) {
          const match = (p.nama + p.noRm + p.kamar + p.diagnosis + p.dpjp).toLowerCase();
          return match.includes(currentQuery);
        }
        return true;
      }).sort((a, b) => (a.kamar || '').localeCompare(b.kamar || '', undefined, { numeric: true }));

      const grid = document.getElementById('patient-grid');
      if (filtered.length === 0) {
        grid.className = "grid grid-cols-1";
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-slate-400 text-sm">Belum ada pasien pada filter ini.</div>';
        return;
      }

      // TAMPILAN MODE LIST SIMPLE (Ruangan, Nama, RM, DPJP + Hari Rawat / Tanggal KRS + Info Pembuat/Pengedit)
      if (viewMode === 'list') {
        grid.className = "flex flex-col gap-2";
        grid.innerHTML = filtered.map(p => {
          const hariRawat = hitungHariRawat(p.tglMrs, p.status, p.krsAt);
          return `
          <div onclick="openDetailModal('${p.id}')" class="cursor-pointer bg-white rounded-xl border border-slate-200 px-4 py-3 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 hover:border-emerald-400 hover:bg-emerald-50/20 transition">
            <div class="flex flex-col gap-1 min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2 min-w-0">
                <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-bold shrink-0">${p.kamar}</span>
                <h3 class="text-sm font-bold text-slate-900 truncate">${p.nama}</h3>
                <span class="font-mono bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200 text-xs shrink-0">RM: ${p.noRm}</span>
                <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-200 text-xs shrink-0">${p.dpjp}</span>
                ${hariRawat && p.status === 'Aktif Rawat' ? `<span class="bg-purple-50 text-purple-700 px-2 py-0.5 rounded border border-purple-200 text-xs font-semibold shrink-0">Hari ke-${hariRawat}</span>` : ''}
                ${p.status === 'KRS' && p.krsAt ? `<span class="bg-amber-50 text-amber-700 px-2 py-0.5 rounded border border-amber-200 text-xs font-medium shrink-0">🗓️ KRS: ${formatTanggal(p.krsAt)}${hariRawat ? ` (${hariRawat} hr)` : ''}</span>` : ''}
              </div>
              <!-- Tulisan kecil pembuat / pengedit -->
              <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[11px] text-slate-400 pl-0.5">
                ${formatAuditInline(p)}
              </div>
            </div>
            <div class="flex items-center justify-end gap-2 shrink-0 border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-100" onclick="event.stopPropagation()">
              ${p.status === 'Terhapus' ? `
                <button onclick="restorePatient('${p.id}')" class="py-1 px-2.5 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-600 hover:text-white cursor-pointer">Pulihkan</button>
                <button onclick="permanentDeletePatient('${p.id}')" class="p-1 text-red-500 hover:text-red-700 text-xs font-bold cursor-pointer">Hapus Permanen</button>
              ` : `
                <button onclick="openModal('${p.id}')" class="p-1 text-slate-500 hover:text-blue-600 text-xs font-bold cursor-pointer">Edit</button>
                <button onclick="deletePatient('${p.id}')" class="p-1 text-slate-400 hover:text-red-600 text-xs font-bold cursor-pointer">Hapus</button>
              `}
            </div>
          </div>
        `}).join('');
        return;
      }

      // TAMPILAN MODE KARTU (DEFAULT)
      grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4";
      grid.innerHTML = filtered.map(p => {
        const hariRawat = hitungHariRawat(p.tglMrs, p.status, p.krsAt);
        return `
        <article class="bg-white rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between overflow-hidden">
          <div class="h-1.5 w-full ${p.status === 'Aktif Rawat' ? 'bg-emerald-500' : p.status === 'KRS' ? 'bg-slate-400' : 'bg-red-500'}"></div>
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between gap-2 mb-2">
                <div class="flex items-center gap-1.5">
                  <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-bold">${p.kamar}</span>
                  ${hariRawat ? `<span class="px-2 py-0.5 rounded-lg bg-purple-50 text-purple-700 border border-purple-200 text-xs font-bold">${p.status === 'KRS' ? `Rawat ${hariRawat} hr` : `Hari ke-${hariRawat}`}</span>` : ''}
                </div>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${p.status === 'Aktif Rawat' ? 'bg-emerald-50 text-emerald-700' : p.status === 'KRS' ? 'bg-slate-100 text-slate-600' : 'bg-red-50 text-red-700'}">
                  ${p.status}${p.status === 'KRS' && p.krsAt ? ` • ${formatTanggal(p.krsAt)}` : ''}
                </span>
              </div>
              <h3 class="text-base font-bold text-slate-900">${p.nama}</h3>
              <div class="flex flex-wrap gap-1.5 text-xs mt-1 mb-3">
                <span class="font-mono bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200">RM: ${p.noRm}</span>
                <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-200">${p.dpjp}</span>
                ${p.tglMrs ? `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded border border-slate-200">MRS: ${formatTanggal(p.tglMrs)}</span>` : ''}
              </div>
              <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3 text-xs text-slate-700 leading-relaxed mb-3">
                <p class="font-bold text-[10px] uppercase text-slate-400 mb-0.5">Diagnosis (Dx)</p>
                ${p.diagnosis}
              </div>
              <!-- Tulisan kecil di bawah diagnosis: Siapa yang membuat / mengedit -->
              <div class="pt-2 pb-1 border-t border-slate-100/80 text-[11px] text-slate-400 flex flex-col gap-0.5 leading-tight">
                ${formatAuditFooter(p)}
              </div>
            </div>
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
              ${p.status === 'Terhapus' ? `
                <button onclick="restorePatient('${p.id}')" class="flex-1 py-1.5 px-3 rounded-xl text-xs font-semibold border bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-600 hover:text-white cursor-pointer">
                  Pulihkan Pasien
                </button>
                <button onclick="permanentDeletePatient('${p.id}')" class="py-1.5 px-2.5 rounded-xl bg-red-50 text-red-600 hover:bg-red-600 hover:text-white text-xs font-bold border border-red-200 cursor-pointer">
                  Hapus Permanen
                </button>
              ` : `
                <button onclick="toggleStatus('${p.id}', '${p.status}')" class="flex-1 py-1.5 px-3 rounded-xl text-xs font-semibold border cursor-pointer ${p.status === 'Aktif Rawat' ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-600 hover:text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                  ${p.status === 'Aktif Rawat' ? 'Tandai KRS' : 'Aktifkan Kembali'}
                </button>
                <button onclick="openModal('${p.id}')" class="p-1.5 text-slate-500 hover:text-blue-600 text-xs font-bold cursor-pointer">Edit</button>
                <button onclick="deletePatient('${p.id}')" class="p-1.5 text-slate-400 hover:text-red-600 text-xs font-bold cursor-pointer">Hapus</button>
              `}
            </div>
          </div>
        </article>
      `}).join('');
    }

    // Inisialisasi status user saat halaman pertama kali dibuka
    initAuth();
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header Utama -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <!-- Sisi Kiri: Logo & Tajuk + Info User Mobile -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center text-xl shadow-xs shrink-0">
            🌹
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight">List Pasien Mawar</h1>
              <span id="sync-indicator" class="px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 shrink-0">Live Synced</span>
            </div>
            <p class="text-xs text-slate-500 hidden sm:block">Tracking & Operan Jaga Rawat Inap by DM Obgyn</p>
          </div>
        </div>

        <!-- Tombol Mobile: User Widget & Tambah Pasien -->
        <div class="flex items-center gap-1.5 md:hidden">
          <button onclick="openLoginModal()" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 px-2 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700 transition cursor-pointer" title="Ganti User">
            <span id="user-avatar-mobile" class="w-5 h-5 rounded-md bg-emerald-600 text-white flex items-center justify-center text-[10px] font-bold shrink-0">?</span>
            <span id="user-display-name-mobile" class="max-w-[70px] truncate text-[11px]">Login</span>
          </button>
          <button onclick="openModal()" class="bg-emerald-600 text-white font-semibold text-xs px-2.5 py-1.5 rounded-xl shadow-xs cursor-pointer">
            + Pasien
          </button>
        </div>
      </div>

      <!-- Sisi Kanan: Tab Aktif/KRS/Terhapus, User Profile (Desktop), Salin Operan & Tambah Pasien -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-medium">
          <button onclick="setStatusFilter('Aktif Rawat')" id="tab-aktif" class="px-3 py-1.5 rounded-lg bg-white text-emerald-700 font-bold shadow-xs cursor-pointer">
            Aktif: <span id="count-aktif">0</span>
          </button>
          <button onclick="setStatusFilter('KRS')" id="tab-krs" class="px-3 py-1.5 rounded-lg text-slate-600 cursor-pointer">
            KRS: <span id="count-krs">0</span>
          </button>
          <button onclick="setStatusFilter('Terhapus')" id="tab-deleted" class="px-3 py-1.5 rounded-lg text-slate-600 cursor-pointer">
            Terhapus: <span id="count-deleted">0</span>
          </button>
        </div>

        <button onclick="copyHandoff()" class="px-3 py-2 text-xs font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-xl shadow-xs cursor-pointer flex items-center gap-1">
          <span>📋</span> Salin Operan
        </button>

        <!-- User Info Widget Desktop -->
        <div onclick="openLoginModal()" class="hidden md:flex items-center gap-2 bg-slate-50 hover:bg-slate-100 border border-slate-200 py-1.5 px-3 rounded-xl text-xs cursor-pointer transition select-none" title="Klik untuk ganti pengguna atau keluar">
          <div id="user-avatar" class="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-xs">?</div>
          <div class="text-left">
            <div class="font-bold text-slate-800 leading-tight truncate max-w-[120px]" id="user-display-name">Belum Login</div>
            <div class="text-[10px] text-slate-500 leading-tight" id="user-display-role">Klik untuk Masuk</div>
          </div>
          <button type="button" onclick="event.stopPropagation(); logoutUser();" id="btn-logout" class="hidden text-slate-400 hover:text-red-600 ml-1 p-0.5 rounded text-xs font-bold" title="Ganti Pengguna / Logout">⎋</button>
        </div>

        <button onclick="openModal()" class="hidden md:inline-flex bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-xs cursor-pointer">
          + Tambah Pasien
        </button>
      </div>
    </div>
  </header>

  <!-- Filter & Pencarian -->
  <section class="bg-white border-b border-slate-200 py-3">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center gap-2.5">
      <input id="search-input" type="text" oninput="handleSearch(this.value)" placeholder="Cari pasien, No. RM, kamar, atau diagnosis..." class="w-full sm:flex-1 px-3.5 py-2 bg-slate-50 text-sm rounded-xl border border-slate-200 focus:outline-emerald-500" />
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <select id="filter-dpjp" onchange="handleDpjpFilter(this.value)" class="flex-1 sm:w-56 px-3 py-2 bg-slate-50 text-xs text-slate-700 rounded-xl border border-slate-200">
          <option value="Semua">Semua DPJP</option>
        </select>
        <!-- Toggle Mode Tampilan: Kartu vs List -->
        <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-medium shrink-0">
          <button onclick="setViewMode('grid')" id="btn-view-grid" class="px-3 py-1.5 rounded-lg bg-white text-emerald-700 font-bold shadow-xs flex items-center gap-1 cursor-pointer">
            <span>▦</span> Kartu
          </button>
          <button onclick="setViewMode('list')" id="btn-view-list" class="px-3 py-1.5 rounded-lg text-slate-600 flex items-center gap-1 cursor-pointer">
            <span>☰</span> List
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Grid Utama Pasien -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
    <div id="patient-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <!-- Modal Pop-up Detail Pasien (Saat klik baris di Mode List) -->
  <div id="detail-modal" onclick="closeDetailModal()" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div onclick="event.stopPropagation()" class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden">
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-200 bg-slate-50">
        <div class="flex items-center gap-2">
          <span id="detail-kamar" class="px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-bold"></span>
          <span id="detail-status" class="px-2.5 py-0.5 rounded-full text-xs font-semibold"></span>
        </div>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold leading-none cursor-pointer">&times;</button>
      </div>
      <div class="p-5 space-y-4">
        <div>
          <h3 id="detail-nama" class="text-lg font-bold text-slate-900"></h3>
          <div class="flex flex-wrap gap-2 text-xs mt-1.5">
            <span id="detail-norm" class="font-mono bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded border border-slate-200"></span>
            <span id="detail-dpjp" class="bg-blue-50 text-blue-700 px-2.5 py-0.5 rounded border border-blue-200 font-medium"></span>
            <span id="detail-mrs" class="bg-purple-50 text-purple-700 px-2.5 py-0.5 rounded border border-purple-200 font-semibold hidden"></span>
          </div>
        </div>
        <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3.5 text-xs text-slate-700 leading-relaxed whitespace-pre-line">
          <p class="font-bold text-[10px] uppercase text-slate-400 mb-1">Diagnosis (Dx) & Terapi</p>
          <div id="detail-dx"></div>
        </div>
        <!-- Riwayat Pembuat & Terakhir Mengedit -->
        <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3 text-xs text-slate-600 space-y-1.5">
          <div class="flex items-center justify-between">
            <span class="text-slate-400">✍️ Dibuat oleh:</span>
            <span id="detail-created" class="font-medium text-slate-800">-</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-slate-400">✏️ Terakhir diedit:</span>
            <span id="detail-updated" class="font-medium text-slate-800">-</span>
          </div>
        </div>
        <div id="detail-actions" class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2"></div>
      </div>
    </div>
  </div>

  <!-- Modal Form Tambah / Edit Pasien -->
  <div id="modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-lg overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200 bg-slate-50">
        <h2 id="modal-title" class="text-base font-bold text-slate-900">Input Pasien Baru</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold cursor-pointer">&times;</button>
      </div>
      <form id="patient-form" onsubmit="savePatient(event)" class="p-5 space-y-4">
        <input type="hidden" id="edit-id" />
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-600 mb-1">Nama Pasien *</label>
            <input id="input-nama" required type="text" placeholder="Ny. Siti Aminah" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 focus:outline-emerald-600" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">No. RM *</label>
            <input id="input-norm" required type="text" placeholder="00-12-34-56" class="w-full px-3 py-2 text-sm font-mono rounded-xl border border-slate-300 focus:outline-emerald-600" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Kamar / Bed *</label>
            <input id="input-kamar" required type="text" placeholder="Mawar 1 - Bed A" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 focus:outline-emerald-600" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">DPJP</label>
            <select id="select-dpjp" onchange="handleDpjpSelectChange(this.value)" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 bg-white focus:outline-emerald-600">
              <option value="dr. M Dwinanda Junaedi, Sp.OG">dr. M Dwinanda Junaedi, Sp.OG</option>
              <option value="dr. Fatimah Z, Sp.OG">dr. Fatimah Z, Sp.OG</option>
              <option value="dr. Ericka Anggraini, Sp.OG M.Ked.Klin">dr. Ericka Anggraini, Sp.OG M.Ked.Klin</option>
              <option value="dr. Fitriarto Mahardika W, Sp.OG">dr. Fitriarto Mahardika W, Sp.OG</option>
              <option value="dr. Gatut Hardianto, Sp.OG(K)-Urogin Re">dr. Gatut Hardianto, Sp.OG(K)-Urogin Re</option>
              <option value="MANUAL">+ Ketik DPJP Sendiri (Non-Obgyn)...</option>
            </select>
            <input id="input-dpjp-manual" type="text" placeholder="Ketik nama DPJP Non-Obgyn..." class="hidden mt-2 w-full px-3 py-2 text-sm rounded-xl border border-slate-300 focus:outline-emerald-600" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Tanggal MRS</label>
            <input id="input-mrs" type="date" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 bg-white focus:outline-emerald-600" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Status Pasien</label>
            <select id="input-status" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 bg-white">
              <option value="Aktif Rawat">Aktif Rawat</option>
              <option value="KRS">KRS (Pulang)</option>
              <option value="Terhapus">Terhapus</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Diagnosis (Dx)</label>
          <textarea id="input-dx" rows="3" placeholder="Diagnosis dan terapi harian..." class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 focus:outline-emerald-600"></textarea>
        </div>
        <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-200">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-slate-600 rounded-xl cursor-pointer">Batal</button>
          <button type="submit" class="px-5 py-2 text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl cursor-pointer">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Login Petugas / Dokter -->
  <div id="login-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden relative">
      <button id="login-modal-close" onclick="closeLoginModal()" class="hidden absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl font-bold leading-none cursor-pointer">&times;</button>
      <div class="p-6 text-center border-b border-slate-100 bg-emerald-50/50">
        <div class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-800 flex items-center justify-center text-3xl mx-auto mb-3 shadow-xs">
          🌹
        </div>
        <h2 class="text-lg font-bold text-slate-900">Login Petugas Jaga</h2>
        <p class="text-xs text-slate-500 mt-1">Identitas Anda akan tercatat otomatis saat menambah atau mengedit data pasien</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="p-6 space-y-4">
        <!-- Pilihan Cepat Akun Sebelumnya -->
        <div id="recent-users-section" class="hidden">
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Pilih Cepat Pengguna Sebelumnya:</label>
          <div id="recent-users-list" class="flex flex-wrap gap-1.5"></div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nama Dokter / Petugas *</label>
          <input id="input-login-name" required type="text" placeholder="Contoh: DM yafi" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:outline-emerald-600" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">PIN Ruangan</label>
          <input id="input-login-pin" type="password" placeholder="Masukkan PIN Ruangan" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:outline-emerald-600" />
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-2.5 px-4 rounded-xl text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-xs transition cursor-pointer">
            Masuk / Mulai Jaga
          </button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
