<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WardTracker - Tracking & Handoff Pasien</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel untuk eksekusi React langsung di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.15s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- ICON SVG HELPER (Pengganti Lucide React murni) ---
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const icons = {
        activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
        plus: <path d="M5 12h14M12 5v14" />,
        search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
        userCheck: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></>,
        archive: <><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></>,
        edit2: <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />,
        trash2: <><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>,
        checkCircle2: <><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>,
        rotateCcw: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>,
        copy: <><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>,
        check: <polyline points="20 6 9 17 4 12"/>,
        bedDouble: <><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/><path d="M12 4v6"/><path d="M2 18h20"/></>,
        stethoscope: <><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></>,
        fileText: <><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></>,
        clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
        x: <path d="M18 6 6 18M6 6l12 12"/>,
        sparkles: <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>,
        wifi: <path d="M12 20h.01M2 8.82a15 15 0 0 1 20 0M5 12.86a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0"/>,
        alertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>,
        hash: <><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></>,
        users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
        keyboard: <><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M18 12h.01M8 12h8"/></>
      };

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          {icons[name] || null}
        </svg>
      );
    };

    // Data Awal Bawaan Bangsal[cite: 9]
    const SAMPLE_PATIENTS = [
      {
        id: 'sample-1',
        nama: 'Tn. Budi Santoso',
        noRm: '00-48-29-11',
        kamar: 'Melati 1 - Bed A',
        dpjp: 'dr. Hendra Wijaya, Sp.PD',
        diagnosis: 'Dengue Hemorrhagic Fever (DHF) Grade II + Trombositopenia (Trombosit terakhir: 42.000) + Observasi febris H-4',
        status: 'Aktif Rawat',
        updatedAt: Date.now() - 3600000
      },
      {
        id: 'sample-2',
        nama: 'Ny. Siti Aminah',
        noRm: '00-91-04-55',
        kamar: 'Melati 2 - Bed C',
        dpjp: 'dr. Rina Kartika, Sp.JP',
        diagnosis: 'Congestive Heart Failure (CHF) NYHA Fc III + Edema Paru Akut (Perbaikan) + Hipertensi Stage II. Balance cairan target negatif -500cc/24 jam.',
        status: 'Aktif Rawat',
        updatedAt: Date.now() - 7200000
      },
      {
        id: 'sample-3',
        nama: 'Tn. Agus Pratama',
        noRm: '00-73-18-90',
        kamar: 'ICU - Bed 2',
        dpjp: 'dr. Hendra Wijaya, Sp.PD',
        diagnosis: 'Sepsis ec Pneumonia Komunitas Berat + AKI Stage 2 + DM Tipe 2 tidak terkontrol. Terpasang HFNC 40 Lpm FiO2 50%.',
        status: 'Aktif Rawat',
        updatedAt: Date.now() - 10800000
      },
      {
        id: 'sample-4',
        nama: 'An. Kevin Alvaro',
        noRm: '01-12-33-08',
        kamar: 'Anggrek Anak - Bed 1',
        dpjp: 'dr. Maya Putri, Sp.A',
        diagnosis: 'Gastroenteritis Akut (GEA) dengan Dehidrasi Ringan-Sedang (Rehidrasi tercapai, intake oral mulai baik). Rencana KRS sore.',
        status: 'Aktif Rawat',
        updatedAt: Date.now() - 14400000
      },
      {
        id: 'sample-5',
        nama: 'Ny. Ratna Sari',
        noRm: '00-65-21-77',
        kamar: 'Flamboyan 2 - Bed B',
        dpjp: 'dr. Lukman Hakim, Sp.B',
        diagnosis: 'Post Laparotomi Eksplorasi H+3 a/i Appendisitis Perforasi. Luka operasi kering, drain minimal serosa, sudah flatus.',
        status: 'KRS',
        updatedAt: Date.now() - 18000000
      }
    ];

    const DEFAULT_ROOMS = [
      'Melati 1 - Bed A', 'Melati 1 - Bed B', 'Melati 2 - Bed A', 'Melati 2 - Bed C',
      'Flamboyan 1 - Bed A', 'Flamboyan 2 - Bed B', 'Anggrek Anak - Bed 1',
      'ICU - Bed 1', 'ICU - Bed 2', 'HCU - Bed 3', 'Isolasi - Bed 1'
    ];

    const DEFAULT_DPJP = [
      'dr. Hendra Wijaya, Sp.PD', 'dr. Rina Kartika, Sp.JP', 'dr. Maya Putri, Sp.A',
      'dr. Lukman Hakim, Sp.B', 'dr. Faisal Anwar, Sp.P', 'dr. Nadia Utami, Sp.S'
    ];

    function App() {
      const [patients, setPatients] = useState(() => {
        const saved = localStorage.getItem('ward_patients_data');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) { return SAMPLE_PATIENTS; }
        }
        return SAMPLE_PATIENTS;
      });

      const [statusFilter, setStatusFilter] = useState('Aktif Rawat');
      const [dpjpFilter, setDpjpFilter] = useState('Semua');
      const [wardFilter, setWardFilter] = useState('Semua');
      const [searchQuery, setSearchQuery] = useState('');

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingPatient, setEditingPatient] = useState(null);
      const [isSaving, setIsSaving] = useState(false);
      const [formData, setFormData] = useState({
        nama: '', noRm: '', kamar: '', dpjp: '', diagnosis: '', status: 'Aktif Rawat'
      });

      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const [toast, setToast] = useState(null);
      const [isCopied, setIsCopied] = useState(false);
      const [isHandoffModalOpen, setIsHandoffModalOpen] = useState(false);

      const nameInputRef = useRef(null);
      const searchInputRef = useRef(null);

      // Simpan ke storage lokal browser
      useEffect(() => {
        localStorage.setItem('ward_patients_data', JSON.stringify(patients));
      }, [patients]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(prev => prev?.message === message ? null : prev), 3000);
      };

      // Keyboard Shortcuts[cite: 9]
      useEffect(() => {
        const handleKeyDown = (e) => {
          const activeTag = document.activeElement?.tagName?.toLowerCase();
          const isTyping = activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select';

          if ((e.altKey && e.key.toLowerCase() === 'n') || (!isTyping && !isModalOpen && e.key.toLowerCase() === 'n')) {
            e.preventDefault();
            openAddModal();
          }
          if (!isTyping && !isModalOpen && e.key === '/') {
            e.preventDefault();
            searchInputRef.current?.focus();
          }
          if (e.key === 'Escape') {
            if (isModalOpen) closeModal();
            if (isHandoffModalOpen) setIsHandoffModalOpen(false);
            if (confirmDeleteId) setConfirmDeleteId(null);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isModalOpen, isHandoffModalOpen, confirmDeleteId]);

      useEffect(() => {
        if (isModalOpen) {
          setTimeout(() => nameInputRef.current?.focus(), 60);
        }
      }, [isModalOpen]);

      const stats = useMemo(() => {
        const aktif = patients.filter(p => p.status === 'Aktif Rawat').length;
        const krs = patients.filter(p => p.status === 'KRS').length;
        return { aktif, krs, total: patients.length };
      }, [patients]);

      const uniqueDpjpList = useMemo(() => {
        const fromData = patients.map(p => p.dpjp?.trim()).filter(Boolean);
        return Array.from(new Set([...fromData, ...DEFAULT_DPJP])).sort();
      }, [patients]);

      const activeFilterDpjpList = useMemo(() => {
        const fromData = patients.map(p => p.dpjp?.trim()).filter(Boolean);
        return Array.from(new Set(fromData)).sort();
      }, [patients]);

      const uniqueRoomList = useMemo(() => {
        const fromData = patients.map(p => p.kamar?.trim()).filter(Boolean);
        return Array.from(new Set([...fromData, ...DEFAULT_ROOMS])).sort();
      }, [patients]);

      const uniqueWardPrefixes = useMemo(() => {
        const prefixes = patients
          .map(p => p.kamar ? p.kamar.split('-')[0].trim() : '')
          .filter(Boolean);
        return Array.from(new Set(prefixes)).sort();
      }, [patients]);

      const filteredPatients = useMemo(() => {
        return patients.filter((p) => {
          if (statusFilter !== 'Semua' && p.status !== statusFilter) return false;
          if (dpjpFilter !== 'Semua' && p.dpjp !== dpjpFilter) return false;
          if (wardFilter !== 'Semua' && !(p.kamar || '').toLowerCase().startsWith(wardFilter.toLowerCase())) return false;
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase().trim();
            return (p.nama || '').toLowerCase().includes(q) ||
                   (p.noRm || '').toLowerCase().includes(q) ||
                   (p.kamar || '').toLowerCase().includes(q) ||
                   (p.diagnosis || '').toLowerCase().includes(q) ||
                   (p.dpjp || '').toLowerCase().includes(q);
          }
          return true;
        }).sort((a, b) => (a.kamar || '').localeCompare(b.kamar || '', undefined, { numeric: true }));
      }, [patients, statusFilter, dpjpFilter, wardFilter, searchQuery]);

      const openAddModal = () => {
        setEditingPatient(null);
        setFormData({
          nama: '', noRm: '', kamar: '',
          dpjp: dpjpFilter !== 'Semua' ? dpjpFilter : '',
          diagnosis: '', status: 'Aktif Rawat'
        });
        setIsModalOpen(true);
      };

      const openEditModal = (patient) => {
        setEditingPatient(patient);
        setFormData({
          nama: patient.nama || '',
          noRm: patient.noRm || '',
          kamar: patient.kamar || '',
          dpjp: patient.dpjp || '',
          diagnosis: patient.diagnosis || '',
          status: patient.status || 'Aktif Rawat'
        });
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingPatient(null);
      };

      const handleSavePatient = (e) => {
        if (e) e.preventDefault();
        if (!formData.nama.trim() || !formData.noRm.trim() || !formData.kamar.trim()) {
          showToast('Mohon lengkapi Nama Pasien, No. RM, dan Kamar/Bed.', 'error');
          return;
        }

        const now = Date.now();
        const payload = {
          nama: formData.nama.trim(),
          noRm: formData.noRm.trim(),
          kamar: formData.kamar.trim(),
          dpjp: formData.dpjp.trim() || 'DPJP Umum',
          diagnosis: formData.diagnosis.trim() || '-',
          status: formData.status,
          updatedAt: now
        };

        if (editingPatient) {
          setPatients(prev => prev.map(p => p.id === editingPatient.id ? { ...p, ...payload } : p));
          showToast(`Data ${payload.nama} berhasil diperbarui.`);
        } else {
          setPatients(prev => [{ id: 'p_' + now, ...payload, createdAt: now }, ...prev]);
          showToast(`Pasien ${payload.nama} ditambahkan.`);
        }
        closeModal();
      };

      const handleQuickToggleStatus = (patient) => {
        const newStatus = patient.status === 'Aktif Rawat' ? 'KRS' : 'Aktif Rawat';
        setPatients(prev => prev.map(p => p.id === patient.id ? { ...p, status: newStatus, updatedAt: Date.now() } : p));
        showToast(
          newStatus === 'KRS' 
            ? `${patient.nama} ditandai KRS & masuk arsip.` 
            : `${patient.nama} dikembalikan ke Aktif Rawat.`
        );
      };

      const handleDeletePatient = (patient) => {
        setPatients(prev => prev.filter(p => p.id !== patient.id));
        setConfirmDeleteId(null);
        showToast(`Data pasien ${patient.nama} telah dihapus.`);
      };

      const formatTimestamp = (ts) => {
        if (!ts) return '-';
        const date = new Date(ts);
        return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      };

      const generateHandoffText = () => {
        const activeList = patients.filter(p => p.status === 'Aktif Rawat');
        const dateNow = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        const timeNow = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        if (activeList.length === 0) {
          return `*OPERAN JAGA BANGSAL (${dateNow} - ${timeNow})*\nBelum ada pasien Aktif Rawat saat ini.`;
        }

        let lines = [
          `*LAPORAN OPERAN JAGA RAWAT INAP*`,
          `📅 ${dateNow} | ⏰ ${timeNow}`,
          `📊 Total Aktif Rawat: *${activeList.length} Pasien*`,
          `----------------------------------------`
        ];

        activeList.forEach((p, idx) => {
          lines.push(`${idx + 1}. *[${p.kamar}]* *${p.nama}* (RM: ${p.noRm})\n   • DPJP: ${p.dpjp}\n   • Dx: ${p.diagnosis}`);
        });

        return lines.join('\n\n');
      };

      const handleCopyHandoff = () => {
        const text = generateHandoffText();
        navigator.clipboard.writeText(text).then(() => {
          setIsCopied(true);
          showToast('Ringkasan operan jaga berhasil disalin!');
          setTimeout(() => setIsCopied(false), 2500);
        }).catch(() => {
          showToast('Gagal menyalin ringkasan operan.', 'error');
        });
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 max-w-sm animate-bounce">
              <div className={`flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium ${
                toast.type === 'error' ? 'bg-red-600 text-white border-red-700' : 'bg-slate-900 text-white border-slate-800'
              }`}>
                <Icon name={toast.type === 'error' ? 'alertCircle' : 'checkCircle2'} className="w-4 h-4 text-emerald-400 shrink-0" />
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* Header Sticky */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
              <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3.5">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-xs">
                      <Icon name="activity" className="w-5 h-5" />
                    </div>
                    <div>
                      <div className="flex items-center gap-2.5">
                        <h1 className="text-lg sm:text-xl font-bold tracking-tight text-slate-900">WardTracker</h1>
                        <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                          <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                          <span>Ready</span>
                        </span>
                      </div>
                      <p className="text-xs text-slate-500">Tracking & Operan Jaga Pasien Rawat Inap Harian</p>
                    </div>
                  </div>

                  <button
                    onClick={openAddModal}
                    className="md:hidden inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-3.5 py-2 rounded-xl"
                  >
                    <Icon name="plus" className="w-4 h-4" />
                    <span>Pasien</span>
                  </button>
                </div>

                <div className="flex flex-wrap items-center justify-between md:justify-end gap-2.5">
                  <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-medium">
                    <button
                      onClick={() => setStatusFilter('Aktif Rawat')}
                      className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg transition ${
                        statusFilter === 'Aktif Rawat' ? 'bg-white text-emerald-700 shadow-xs font-semibold' : 'text-slate-600'
                      }`}
                    >
                      <span className="w-2 h-2 rounded-full bg-emerald-500" />
                      <span>Aktif:</span>
                      <span className="font-bold text-slate-900">{stats.aktif}</span>
                    </button>
                    <div className="h-4 w-px bg-slate-300 mx-0.5" />
                    <button
                      onClick={() => setStatusFilter('KRS')}
                      className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg transition ${
                        statusFilter === 'KRS' ? 'bg-white text-slate-800 shadow-xs font-semibold' : 'text-slate-600'
                      }`}
                    >
                      <span className="w-2 h-2 rounded-full bg-slate-400" />
                      <span>KRS:</span>
                      <span className="font-bold text-slate-900">{stats.krs}</span>
                    </button>
                  </div>

                  <button
                    onClick={() => setIsHandoffModalOpen(true)}
                    className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 shadow-xs"
                  >
                    <Icon name={isCopied ? "check" : "copy"} className="w-4 h-4 text-slate-500" />
                    <span>Salin Operan</span>
                  </button>

                  <button
                    onClick={openAddModal}
                    className="hidden md:inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-4 py-2 rounded-xl shadow-xs"
                  >
                    <Icon name="plus" className="w-4 h-4" />
                    <span>Tambah Pasien</span>
                    <kbd className="ml-1 px-1.5 py-0.5 text-[10px] font-mono bg-emerald-700 text-emerald-100 rounded">N</kbd>
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Bar Filter & Pencarian */}
          <section className="bg-white border-b border-slate-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                <div className="flex items-center gap-1.5 overflow-x-auto pb-1 lg:pb-0">
                  <button
                    onClick={() => setStatusFilter('Aktif Rawat')}
                    className={`inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                      statusFilter === 'Aktif Rawat' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'
                    }`}
                  >
                    <Icon name="userCheck" className="w-4 h-4" />
                    <span>Aktif Rawat</span>
                    <span className="px-1.5 py-0.2 rounded-full text-xs bg-emerald-700 text-white">{stats.aktif}</span>
                  </button>

                  <button
                    onClick={() => setStatusFilter('KRS')}
                    className={`inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                      statusFilter === 'KRS' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600'
                    }`}
                  >
                    <Icon name="archive" className="w-4 h-4" />
                    <span>Arsip KRS</span>
                    <span className="px-1.5 py-0.2 rounded-full text-xs bg-slate-700 text-white">{stats.krs}</span>
                  </button>

                  <button
                    onClick={() => setStatusFilter('Semua')}
                    className={`inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                      statusFilter === 'Semua' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'
